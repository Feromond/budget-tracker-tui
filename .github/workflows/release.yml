name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: budget-tracker

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag & test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(awk -F'"' '/^\[/{s=$0} s=="[package]" && /^version = /{print $2; exit}' Cargo.toml)
          bundle_version=$(awk -F'"' '/^\[/{s=$0} s=="[package.metadata.bundle]" && /^version = /{print $2; exit}' Cargo.toml)

          echo "tag:    $tag_version"
          echo "package: $pkg_version"
          echo "bundle:  $bundle_version"

          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match [package] version $pkg_version in Cargo.toml."
            exit 1
          fi
          if [ "$tag_version" != "$bundle_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match [package.metadata.bundle] version $bundle_version in Cargo.toml."
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Check the update signing key matches the app
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::UPDATE_SIGNING_KEY isn't set."; exit 1; }
          public=$(printf '%s\n' "$UPDATE_SIGNING_KEY" | openssl pkey -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          grep -q "\"$public\"" src/app/updater.rs \
            || { echo "::error::UPDATE_SIGNING_KEY doesn't match PUBLIC_KEY_HEX in src/app/updater.rs."; exit 1; }

      - name: Check Windows signing settings
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for name in ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_PROFILE \
            AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!name}" ] || { echo "::error::$name isn't set (Windows signing is on)."; exit 1; }
          done

      - name: Check macOS signing settings
        if: vars.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::$name isn't set (macOS signing is on)."; exit 1; }
          done

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Verify the crate packages cleanly for crates.io
        run: cargo publish --dry-run --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 links against an older glibc, which widens the range of
          # distributions the gnu binaries will run on. The musl builds are
          # fully static (rusqlite is vendored) and run anywhere regardless.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          # arm64 Linux runners are free on public repos, so no cross-compiling.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          # macos-latest runners are Apple Silicon.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusqlite builds SQLite from C source, so musl needs its own compiler.
      - name: Install musl toolchain
        if: contains(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install cargo-packager
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      # Local builds stay unsigned.
      - name: Set up Windows signing
        if: runner.os == 'Windows' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        env:
          CLIENT_VERSION: 1.0.128
          CLIENT_SHA256: 74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\artifact-signing.zip"
          $dir = "$env:RUNNER_TEMP\artifact-signing"
          Invoke-WebRequest -OutFile $zip `
            "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$env:CLIENT_VERSION/microsoft.artifactsigning.client.$env:CLIENT_VERSION.nupkg"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:CLIENT_SHA256) {
            throw "Microsoft.ArtifactSigning.Client $env:CLIENT_VERSION doesn't match its pinned hash."
          }
          Expand-Archive $zip $dir
          "ARTIFACT_SIGNING_DLIB=$dir\bin\x64\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
          "SIGNED_LOG=$env:RUNNER_TEMP\signed-files.txt" >> $env:GITHUB_ENV
          "BUDGET_TRACKER_SIGN_SCRIPT=$env:GITHUB_WORKSPACE\packaging\windows\sign.ps1" >> $env:GITHUB_ENV
          # Use a bare name on PATH: spaces and relative paths break signing.
          "$env:GITHUB_WORKSPACE\packaging\windows" >> $env:GITHUB_PATH
          Add-Content Cargo.toml "`n[package.metadata.packager.windows]`nsign-command = `"budget-tracker-sign.cmd %1`""

      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: cargo packager --release --target ${{ matrix.target }} --formats nsis

      # makensis ignores a failed uninstaller signature, so count all three.
      - name: Check Windows signatures
        if: runner.os == 'Windows' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $signed = @(Get-Content $env:SIGNED_LOG | Where-Object { $_ })
          $signed
          if ($signed.Count -lt 3) {
            throw "Only $($signed.Count) of 3 files were signed (app, uninstaller, installer)."
          }

      # A browser-downloaded binary is quarantined, and macOS blocks it unless it's
      # notarized. A bare binary can't carry a stapled ticket, so Gatekeeper checks
      # with Apple online on first run.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && vars.APPLE_SIGNING_IDENTITY != ''
        env:
          TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/$BIN_NAME"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # Notarization requires the hardened runtime and a secure timestamp.
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" --keychain "$keychain" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m --output-format json)
          echo "$result"
          if [ "$(jq -r .status <<< "$result")" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" \
              --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::Apple didn't accept the notarization."
            exit 1
          fi
          rm -f "$key" "$RUNNER_TEMP/notarize.zip"
          security delete-keychain "$keychain"

      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          pkg="$BIN_NAME-$VERSION-$TARGET"
          out="target/$TARGET/release"

          mkdir -p "dist/$pkg"
          cp LICENSE README.md "dist/$pkg/"

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$out/$BIN_NAME.exe" "dist/$pkg/"
            (cd dist && 7z a -tzip "$pkg.zip" "$pkg" > /dev/null)
            cp target/packages/*-setup.exe "dist/$pkg-setup.exe"
          else
            cp "$out/$BIN_NAME" "dist/$pkg/"
            (cd dist && tar czf "$pkg.tar.gz" "$pkg")
          fi

          rm -rf "dist/$pkg"
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft_release:
    name: Create draft release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          files='{}'
          for f in dist/"$BIN_NAME-$VERSION"-*; do
            name=$(basename "$f")
            key=${name#"$BIN_NAME-$VERSION-"}
            key=${key%.tar.gz}; key=${key%.zip}; key=${key%.exe}
            files=$(jq -c --arg k "$key" --arg url "$base/$name" \
              --argjson size "$(wc -c < "$f" | tr -d ' ')" \
              --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" \
              '. + {($k): {url: $url, size: $size, sha256: $sha}}' <<< "$files")
          done
          jq -n --arg v "$VERSION" --argjson files "$files" '{version: $v, files: $files}' > dist/latest.json
          key_file="$RUNNER_TEMP/update-key.pem"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file")
          { printf 'budget-tracker/update/v1\0'; cat dist/latest.json; } > "$RUNNER_TEMP/signed.bin"
          openssl pkeyutl -sign -inkey "$key_file" -rawin -in "$RUNNER_TEMP/signed.bin" \
            | base64 | tr -d '\n' > dist/latest.json.sig
          rm -f "$key_file" "$RUNNER_TEMP/signed.bin"
          cat dist/latest.json

      # Package managers pin these hashes in their manifests, so every asset
      # needs one and none of them may change after the release is published.
      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Create or update the draft release
        env:
          # RELEASE_TOKEN is a personal access token, so the release is
          # attributed to the account that owns it rather than to the bot.
          # Falls back to the built-in token when the secret is absent.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing the assets only."
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -q .body > generated_notes.md

          {
            cat generated_notes.md
            echo
            cat <<'EOF'

          ## Install

          The app's page, [ventra.dev/budget-tracker](https://ventra.dev/budget-tracker), has a tour of every feature, how to use it, and a download for your system.

          ```bash
          cargo install budget-tracker-tui
          # or
          brew install budget-tracker
          ```

          On Windows, the `*-setup.exe` installer below adds `budget-tracker` to your PATH.

          From 1.8.0 on, the app offers each new version itself when it starts.

          <details><summary>All downloads</summary>

          Unpack the archive for your platform and put `budget-tracker` on your PATH.

          | File | Platform |
          | --- | --- |
          | `*-x86_64-pc-windows-msvc-setup.exe` | Windows installer |
          | `*-x86_64-pc-windows-msvc.zip` | Windows x86_64 |
          | `*-aarch64-apple-darwin.tar.gz` | macOS Apple Silicon |
          | `*-x86_64-unknown-linux-gnu.tar.gz` | Linux x86_64 (glibc 2.35+) |
          | `*-x86_64-unknown-linux-musl.tar.gz` | Linux x86_64 (static, any distro) |
          | `*-aarch64-unknown-linux-gnu.tar.gz` | Linux arm64 (glibc 2.35+) |
          | `*-aarch64-unknown-linux-musl.tar.gz` | Linux arm64 (static, any distro) |

          `latest.json` and `latest.json.sig` are for the in-app updater.

          Verify a download with `sha256sum -c SHA256SUMS --ignore-missing`.

          </details>

          ## Summary

          <!-- Write the summary, fill in the TLDR, and add screenshots, then delete this line. -->

          ### TLDR:

          - [x]

          EOF
          } > release_notes.md

          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Budget Tracker $VERSION" \
            --notes-file release_notes.md \
            dist/*

          echo "Draft release created: $(gh release view "$TAG" --json url -q .url)"
