[package]
name = "budget-tracker-tui"
version = "1.6.1"
edition = "2024"
authors = ["Jacob Mish <JacobPMish@gmail.com>"]
description = "A feature rich TUI budget tracker app"
license = "GPL-3.0-only"
repository = "https://github.com/Feromond/budget-tracker-tui"
keywords = ["tui", "budget", "finance", "terminal", "tracker"]
categories = ["command-line-utilities", "finance"]

[dependencies]
ratatui = { version = "0.30.2", features = ["crossterm"] }
crossterm = "0.29.0"
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
serde_json = "1.0.151"
rust_decimal = { version = "1.42.1", features = ["serde"] }
ureq = { version = "3.4.0", features = ["json"] }
semver = "1.0.28"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[[bin]]
name = "budget-tracker"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.31"

[package.metadata.bundle]
name = "Budget Tracker"
identifier = "io.github.Feromond.budget-tracker-tui"
icon = ["/budget_tracker_icon.png"]
version = "1.6.1"
copyright = "Copyright Ventra Software Inc. 2026. All rights reserved."
category = "Finance"
short_description = "A feature rich TUI budget tracker app"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
